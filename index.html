<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F8FD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ассистент">
<title>ИИ-ассистент</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%231E6FD9'/%3E%3Cpath d='M32 14l4.8 13.2L50 32l-13.2 4.8L32 50l-4.8-13.2L14 32l13.2-4.8z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#F4F8FD;--card:#FFFFFF;--line:#E3ECF7;--line2:#D6E2F2;--ink:#0F2341;--muted:#4A5B75;--muted2:#5B6B84;--blue:#1E6FD9;--blue-d:#1557AE;--blue-l:#E6F0FC;--red:#B42318}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0;text-align:inherit}
.phone{position:relative;max-width:430px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:640px){body{background:#DCE7F5}.phone{height:min(880px,calc(100vh - 48px));margin:24px auto;border-radius:40px;box-shadow:0 30px 80px rgba(15,35,65,.18);border:1px solid #CFDDF0}}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 28px) 20px 32px;display:flex;flex-direction:column;gap:18px}
.scroll.pad-fab{padding-bottom:100px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sub{font-size:14px;font-weight:500;color:var(--muted)}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:20px;font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.wrap{flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.meta{font-size:12px;color:var(--muted)}
.hero{background:var(--blue);color:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .lbl{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}
.hero p{margin:0;font-size:17px;font-weight:600;line-height:1.4}
.btn{min-height:44px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn-white{background:#fff;color:var(--blue-d)}
.btn-ghost-w{border:1px solid #fff;color:#fff}
.btn-primary{background:var(--blue);color:#fff}
.btn-outline{background:#fff;border:1px solid #C9DAF0;color:var(--blue-d)}
.btn-block{width:100%;min-height:52px;font-size:16px;font-weight:700;border-radius:14px;flex-shrink:0}
.btn.disabled{background:var(--line);color:var(--muted2);cursor:not-allowed}
.bar{height:8px;border-radius:999px;background:var(--blue-l);overflow:hidden}
.bar>div{height:100%;background:var(--blue);border-radius:999px;transition:width .3s}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border-radius:12px;padding:10px 12px}
.stat span{font-size:12px;font-weight:600}
.stat b{display:block;font-size:20px;color:var(--ink)}
.link-card{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0}
.sched{display:flex;gap:10px}
.sched .t{width:44px;flex-shrink:0;padding-top:16px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.item{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 6px 10px 14px;display:flex;gap:6px;align-items:center}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.title{font-size:15px;font-weight:600;line-height:1.3}
.done .title{text-decoration:line-through;color:var(--muted2)}
.chk{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk span{width:26px;height:26px;border-radius:50%;border:2px solid #B7C7DC;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff;transition:.15s}
.chk.sq span{border-radius:8px;width:24px;height:24px}
.chk.on span{background:var(--blue);border-color:var(--blue)}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px;scrollbar-width:none}
.pills::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;min-height:40px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;background:#fff;border:1.5px solid var(--line2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill small{font-size:12px;font-weight:500;opacity:.8}
.pill.dashed{background:transparent;border-style:dashed;border-color:#9CB8DE;color:var(--blue)}
.pill.sm{min-height:32px;padding:0 12px;font-size:13px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--line);border-radius:12px;padding:4px}
.seg button{min-height:36px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);text-align:center}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(15,35,65,.12)}
.list{display:flex;flex-direction:column;gap:10px}
.task{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 14px 12px 6px;display:flex;gap:4px;align-items:flex-start}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:10px}
.when{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{min-height:72px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.day .w{font-size:12px;font-weight:500}
.day .n{font-size:18px;font-weight:700}
.day.today{border-color:var(--blue)}
.day.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .h{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0}
.month .h.we{color:#9A4A0C}
.cell{height:46px;border-radius:12px;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:500}
.cell.out{color:#8A99AE}
.cell.today{border-color:var(--blue);font-weight:700}
.cell.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.cell .dots{height:5px}
.cell .dots i{width:5px;height:5px}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:#0A6B60;background:#DDF4F1;border-radius:12px;padding:10px 12px}
.ev{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:14px;align-items:center}
.ev .tm{width:66px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.ev .tm b{font-size:15px;font-variant-numeric:tabular-nums}
.ev .sep{width:1px;align-self:stretch;background:var(--line)}
.empty{background:#fff;border:1px dashed #C9DAF0;border-radius:16px;padding:18px;text-align:center;font-size:14px;color:var(--muted)}
.add-dashed{min-height:52px;border-radius:14px;border:1.5px dashed #9CB8DE;color:var(--blue);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.chat-head{flex-shrink:0;padding:calc(env(safe-area-inset-top) + 20px) 20px 14px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;font-size:15px;line-height:1.4;padding:10px 14px}
.msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-radius:18px 18px 6px 18px;white-space:pre-wrap}
.msg.agent{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px 18px 18px 6px;display:flex;flex-direction:column;gap:10px}
.mini{border-radius:12px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.mini .k{font-size:12px;font-weight:600}
.mini .m{font-size:13px;color:var(--muted)}
.chips{flex-shrink:0;display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.chip{flex-shrink:0;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #C9DAF0;background:#fff;color:var(--blue-d);font-size:14px;font-weight:600;white-space:nowrap}
.composer{flex-shrink:0;padding:10px 16px 12px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;height:46px;border-radius:23px;border:1px solid var(--line2);background:var(--bg);padding:0 16px;font-size:16px}
.round{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.round.o{border:1px solid var(--line2);background:#fff;color:var(--blue)}
.round.f{background:var(--blue);color:#fff}
.round.rec{background:#FDE8E7;color:var(--red);border-color:#F5B8B4}
.greet{background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.switch{width:52px;height:32px;border-radius:999px;background:#B7C7DC;padding:3px;display:flex;flex-shrink:0;transition:.2s}
.switch i{width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(15,35,65,.25)}
.switch.on{background:var(--blue);justify-content:flex-end}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.set-row+.set-row{border-top:1px solid var(--line)}
.tabbar{flex-shrink:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(env(safe-area-inset-bottom) + 8px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:48px;padding-top:4px;color:var(--muted2);font-size:11px;font-weight:500}
.tab.on{color:var(--blue);font-weight:700}
.fab{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom) + 96px);width:60px;height:60px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(30,111,217,.35)}
.overlay{position:absolute;inset:0;background:rgba(15,35,65,.45);display:flex;flex-direction:column;justify-content:flex-end;z-index:10;animation:fade .2s}
.overlay .shade{flex:1;min-height:40px}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto;animation:up .25s ease-out}
.grab{align-self:center;width:40px;height:5px;border-radius:999px;background:var(--line2);flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.input{height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);padding:0 14px;font-size:16px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
.input:focus,.composer input:focus{outline:2px solid var(--blue);outline-offset:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.err{font-size:13px;font-weight:500;color:var(--red);margin-top:-6px}
.swatches{display:flex;gap:10px}
.sw{width:48px;height:48px;border-radius:50%;border:3px solid transparent;display:flex;align-items:center;justify-content:center}
.sw.on{border-color:var(--ink)}
.sw i{width:32px;height:32px;border-radius:50%;display:block}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 100px);background:var(--ink);color:#fff;font-size:14px;font-weight:500;padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;text-align:center;animation:fade .2s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function () {
'use strict';

/* ---------- Даты ---------- */
var pad = function (n) { return (n < 10 ? '0' : '') + n; };
var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

var TODAY = iso(new Date());

var MON_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MON_N = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var MON_S = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var DOW_S = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
var DOW_L = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
var DOW_ACC = ['каждое воскресенье','каждый понедельник','каждый вторник','каждую среду','каждый четверг','каждую пятницу','каждую субботу'];
var toMin = function (t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; };
var fromMin = function (m) { m = Math.min(m, 23 * 60 + 59); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
var diffDays = function (s) { return Math.round((parse(s) - parse(TODAY)) / 864e5); };
function plural(n, f) { var a = n % 10, b = n % 100; return f[(a === 1 && b !== 11) ? 0 : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? 1 : 2]; }
function durLabel(a, b) {
  if (!a || !b) return '';
  var m = toMin(b) - toMin(a); if (m <= 0) return '';
  var h = Math.floor(m / 60), r = m % 60;
  if (!h) return r + ' мин';
  if (r === 30) return h + ',5 ч';
  return h + ' ч' + (r ? ' ' + r + ' мин' : '');
}
function fmtH(m) { return String(Math.round(m / 30) / 2).replace('.', ',') + ' ч'; }
function fmtShort(s) {
  if (s === TODAY) return 'сегодня';
  if (s === T(1)) return 'завтра';
  var d = parse(s); return DOW_S[d.getDay()].toLowerCase() + ', ' + d.getDate() + ' ' + MON_S[d.getMonth()];
}
function fmtLong(s) { var d = parse(s); return d.getDate() + ' ' + MON_G[d.getMonth()]; }
function nextOcc(md) { var y = parse(TODAY).getFullYear(); var s = iso(parse(y + '-' + md)); if (s < TODAY) s = iso(parse((y + 1) + '-' + md)); return s; }
function leftLabel(n) { if (n === 0) return 'сегодня'; if (n === 1) return 'завтра'; return 'через ' + n + ' ' + plural(n, ['день', 'дня', 'дней']); }
var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

/* ---------- Иконки ---------- */
var ICONS = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  tasks: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7.5 12l3 3 6-6"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.5 3.6 5.2"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  gift: '<rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-1.5-3-5-3.5-5-1.5S10 8 12 8zM12 8c1.5-3 5-3.5 5-1.5S14 8 12 8z"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  chevL: '<path d="M15 6l-6 6 6 6"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',

  send: '<path d="M4 12l16-8-6 16-2.5-6.5z"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  repeat: '<path d="M4 10a6 6 0 0 1 10.5-4H17M17 3v3h-3M20 14a6 6 0 0 1-10.5 4H7M7 21v-3h3"/>',

};
function ic(n, s, w) { s = s || 24; return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="' + (w || 1.8) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>'; }

/* ---------- Категории ---------- */
var EXTRA = [
  { fg: '#A3245F', bg: '#FBE7F0', dot: '#D6508C' },
  { fg: '#4B3DB0', bg: '#ECE9FB', dot: '#7B6CE0' },
  { fg: '#1F5F8B', bg: '#E0F0FA', dot: '#3A9BD9' },
  { fg: '#5C5A12', bg: '#F3F1D6', dot: '#A9A43A' }
];
var SPECIAL = {
  personal: { id: 'personal', label: 'Личное', fg: '#3E5170', bg: '#E8EDF4', dot: '#8A99AE' },

/* ---------- Ассистент (демо-логика) ---------- */
function agentReply(text) {

  if (tm && +tm[1] < 24 && +tm[2] < 60) {
    var day = /послезавтра/.test(t) ? T(2) : /завтра/.test(t) ? T(1) : TODAY;
    var start = pad(+tm[1]) + ':' + tm[2];
    var mins = /полчаса/.test(t) ? 30 : (t.match(/на (\d+) час/) ? +t.match(/на (\d+) час/)[1] * 60 : (/два часа/.test(t) ? 120 : 60));
    var end = fromMin(toMin(start) + mins);
    var c = /трениров|спорт|бассейн|зал|бег|футбол/.test(t) ? 'sport' : /мам|пап|сем|дет|сын|доч|брат|сестр|ужин|родител/.test(t) ? 'family' : 'work';
    var title = text.replace(/\s*(в|к)?\s*\d{1,2}[:.]\d{2}/i, ' ').replace(/(послезавтра|завтра|сегодня)/gi, ' ')
      .replace(/на (полчаса|час|\d+ час\w*|два часа)/gi, ' ').replace(/^\s*(добавь|запиши|поставь|создай|запланируй|напомни)\s+/i, '')
      .replace(/\s+/g, ' ').replace(/^[\s,.\-—]+|[\s,.\-—]+$/g, '');
    title = title ? title.charAt(0).toUpperCase() + title.slice(1) : 'Новое событие';
    S.events.push({ id: uid('e'), date: day, start: start, end: end, title: title, cat: c, allDay: false, src: 'Google Календарь' });
    return { role: 'agent', text: 'Готово, добавил в календарь:', cards: [{ k: 'Событие · Google Календарь', kc: cat(c).fg, title: title, m: fmtShort(day) + ' · ' + start + '–' + end + ' · ' + cat(c).label }], after: 'Если нужно поменять время или категорию — просто напишите.' };
  }
  if (/подар/.test(t)) {
    var n = peopleSorted()[0];
    if (!n) return { role: 'agent', text: 'Добавьте дни рождения во вкладке «Люди», и я подберу идеи.' };
    return { role: 'agent', text: 'Идеи подарка (' + n.p.name + ', ' + fmtLong(n.next) + '):', cards: giftsFor(n.p).map(function (g) { return { k: 'Идея', kc: '#9A4A0C', title: g, m: '' }; }), after: 'Добавить задачу «Купить подарок» на ближайший свободный вечер?' };
  }
  if (/завтра/.test(t)) {
    var its = dayItems(T(1));
    if (!its.length) return { role: 'agent', text: 'Завтра, ' + fmtLong(T(1)) + ', день свободен. Могу перенести туда задачи с высоким приоритетом.' };
    return { role: 'agent', text: 'План на завтра, ' + fmtLong(T(1)) + ':', cards: its.map(function (i) {
      return { k: cat(i.cat).label + (i.kind === 'task' ? ' · задача' : ''), kc: cat(i.cat).fg, title: i.title, m: i.allDay ? 'весь день' : i.start + (i.end ? '–' + i.end : '') };
    }), after: 'Остальное время свободно — поставить туда фокус-работу?' };
  }
  if (/недел/.test(t)) {
    var wk = monday(TODAY), cnt = {}, total = 0, best = null, bestN = -1;
    for (var i = 0; i < 7; i++) {
      var s = addDays(wk, i), list = dayItems(s).filter(function (x) { return x.kind !== 'bday'; });
      list.forEach(function (x) { cnt[x.cat] = (cnt[x.cat] || 0) + 1; total++; });
      if (list.length > bestN) { bestN = list.length; best = s; }
    }
    var parts = S.cats.filter(function (c) { return cnt[c.id]; }).map(function (c) { return c.label.toLowerCase() + ' — ' + cnt[c.id]; });
    return { role: 'agent', text: 'На этой неделе ' + total + ' ' + plural(total, ['дело', 'дела', 'дел']) + ': ' + parts.join(', ') + '. Самый плотный день — ' + DOW_L[parse(best).getDay()].toLowerCase() + ', ' + fmtLong(best) + '.' };
  }
  return { role: 'agent', text: 'Понял. В рабочей версии такую просьбу разберёт ИИ. Сейчас попробуйте, например: «Завтра в 10:00 созвон с подрядчиком» — и событие появится в календаре.' };

      S.tasks.unshift(t);
      if (S.taskFilter !== 'all' && S.taskFilter !== t.cat) S.taskFilter = 'all';
      msg = 'Задача добавлена' + (t.cal && t.start && t.date ? ' и появится в календаре' : '');
    } else if (S.sheet === 'cat') {
      var c = EXTRA[+f.color] || EXTRA[0];
      var nc = { id: uid('c'), label: f.name.trim(), fg: c.fg, bg: c.bg, dot: c.dot };
      S.cats.push(nc); S.taskFilter = nc.id;
      msg = 'Категория «' + nc.label + '» создана';
    } else if (S.sheet === 'person') {
      var p = { id: uid('p'), name: f.name.trim(), rel: (f.rel || '').trim(), md: f.date.slice(5), group: f.group, src: 'manual' };
      S.people.push(p);
      msg = 'Добавлено: ' + fmtLong(nextOcc(p.md));
    }
    S.sheet = null; toast(msg);
  },
  calView: function (v) { S.calView = v; selectDay(S.calSel); render(); },
  calPick: function (v) { selectDay(v); render(); },
  calShift: function (v) {
    var dir = +v;
    if (S.calView === 'week') { selectDay(addDays(S.calWeek, 7 * dir)); }
    else {
      var m = S.calM + dir, y = S.calY;
      if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
      var td = parse(TODAY);
      selectDay(td.getFullYear() === y && td.getMonth() === m ? TODAY : iso(new Date(y, m, 1)));
    }
    render();
  },
  chip: function (v) { send(v, false); },
  send: function () { send(S.chatDraft, true); },
  mic: function () { voice(); },
  greetNext: function () { S.greetIdx++; S.copied = false; render(); },
  copy: function () {
    var p = peopleSorted()[0]; if (!p) return;
    var gs = greetFor(p.p), txt = gs[S.greetIdx % gs.length];
    try { if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(function () {}); } catch (e) {}
    S.copied = true; render();
  }
};
app.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || !app.contains(el)) return;
  var fn = A[el.dataset.act];
  if (fn) fn(el.dataset.v, el, e);
});
app.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'chat-input') { S.chatDraft = el.value; return; }
  var k = el.dataset.f; if (!k || el.type === 'date' || el.type === 'time') return;
  S.form[k] = el.value;
  var b = app.querySelector('[data-act="submit"]');
  if (b) { var ok = formOk(); b.classList.toggle('disabled', !ok); b.setAttribute('aria-disabled', String(!ok)); }
});
app.addEventListener('change', function (e) {
  var el = e.target, k = el.dataset.f;
  if (k && (el.type === 'date' || el.type === 'time')) { S.form[k] = el.value; render(); }
});
app.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || e.isComposing) return;
  if (e.target.id === 'chat-input') { e.preventDefault(); send(S.chatDraft, true); }
  else if (e.target.dataset.f && e.target.type === 'text') { e.preventDefault(); A.submit(); }
});

render();
})();
</script>
